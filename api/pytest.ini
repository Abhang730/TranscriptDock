[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ; FastAPI wraps request models in Annotated metadata, which makes pydantic
    ; 2.14 emit a false-positive warning about model aliases (aliases work).
    ignore:The '.*' attribute with value .* was provided to the .Field\(\)` function:UserWarning
